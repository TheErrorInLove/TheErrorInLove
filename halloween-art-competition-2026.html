</head>
<body>
  <header><nav class="wrap" aria-label="Main navigation"><a class="brand" href="index.html" aria-label="The Error in Love home"><img src="the-error-in-love-logo.png" alt="The Error in Love"></a><div class="nav-links"><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">☀ Light mode</button><a href="index.html">Home</a><a href="fanart.html">Fan Art Gallery</a><a href="official-art.html">Official Art</a></div></nav></header>
  <main>
    <section class="hero"><div class="wrap hero-content"><div class="eyebrow">Fan Art Event · 2026</div><h1>Halloween Art <span>Competition</span></h1><p>Winning entries from the Halloween Art Competition 2026.</p><div class="hero-actions"><a class="button" href="fanart.html">Back to Fan Art</a></div></div></section>
    <section class="fanart-gallery-section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Final placements</div><h2>Winning Art</h2></div><p>Congratulations to all three artists.</p></div>
      <div class="gallery-grid">
        <figure class="fanart-card"><a class="fanart-image-link" href="first-place.png" target="_blank" rel="noopener"><img class="fanart-artwork" src="first-place.png" alt="First-place Halloween art by Yü koko"></a><figcaption class="fanart-caption"><strong>1st Place · Yü koko</strong><span>Halloween Art Competition 2026</span></figcaption></figure>
        <figure class="fanart-card"><a class="fanart-image-link" href="second-place.png" target="_blank" rel="noopener"><img class="fanart-artwork" src="second-place.png" alt="Second-place Halloween art by nixyn"></a><figcaption class="fanart-caption"><strong>2nd Place · nixyn</strong><span>Halloween Art Competition 2026</span></figcaption></figure>
        <figure class="fanart-card"><a class="fanart-image-link" href="third-place.jpg" target="_blank" rel="noopener"><img class="fanart-artwork" src="third-place.jpg" alt="Third-place Halloween art by B3@nnzzz"></a><figcaption class="fanart-caption"><strong>3rd Place · B3@nnzzz</strong><span>Halloween Art Competition 2026</span></figcaption></figure>
      </div>
    </div></section>
  </main>
  <section class="horror-control" aria-label="Display mode"><div class="wrap"><button class="horror-toggle icon-toggle" id="horror-toggle" type="button" aria-label="Enter Horror Mode" aria-pressed="false" title="Enter Horror Mode"><span class="mode-symbol" aria-hidden="true"></span><span class="visually-hidden">Enter Horror Mode</span></button></div></section>
  <footer><div class="wrap"><span>© <span id="year"></span> The Error in Love</span><a href="index.html">Main site</a><a href="fanart.html">Fan Art Gallery</a></div></footer>  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const themeButton = document.getElementById('theme-toggle');
    let savedTheme = null;
    try { savedTheme = localStorage.getItem('eil-theme'); } catch (error) { /* Theme still works without browser storage. */ }
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    function updateThemeButton() {
      const explicitTheme = document.documentElement.dataset.theme;
      const isLight = explicitTheme ? explicitTheme === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
      themeButton.textContent = isLight ? '☾ Dark mode' : '☀ Light mode';
      themeButton.setAttribute('aria-pressed', String(isLight));
    }
    updateThemeButton();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) updateThemeButton(); });
    themeButton.addEventListener('click', () => {
      const explicitTheme = document.documentElement.dataset.theme;
      const currentlyLight = explicitTheme ? explicitTheme === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
      const isLight = !currentlyLight;
      document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
      try { localStorage.setItem('eil-theme', isLight ? 'light' : 'dark'); } catch (error) { /* Keep theme selection for this page view. */ }
      updateThemeButton();
    });
    const horrorButton = document.getElementById('horror-toggle');
    function updateHorrorButton() {
      const active = document.documentElement.dataset.horror === 'true';
      const label = active ? 'Return to Cute / Normal Mode' : 'Enter Horror Mode';
      horrorButton.setAttribute('aria-label', label);
      horrorButton.title = label;
      horrorButton.querySelector('.visually-hidden').textContent = label;
      horrorButton.setAttribute('aria-pressed', String(active));
    }
    try { if (localStorage.getItem('eil-horror') === 'true') document.documentElement.dataset.horror = 'true'; } catch (error) { /* Horror mode still works for this page view. */ }
    updateHorrorButton();
    horrorButton.addEventListener('click', () => {
      const active = document.documentElement.dataset.horror !== 'true';
      if (active) document.documentElement.dataset.horror = 'true';
      else delete document.documentElement.dataset.horror;
      try { localStorage.setItem('eil-horror', String(active)); } catch (error) { /* Keep mode selection for this page view. */ }
      updateHorrorButton();
    });
  </script>
</body>
</html>
